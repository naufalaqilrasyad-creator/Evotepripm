    <!-- PWA Service Worker & Manifest Script Injection -->
    <script>
        const manifest = {
            name: "E-Voting PR IPM SMP Muhammadiyah Merauke",
            short_name: "IPM Vote",
            start_url: "./",
            display: "standalone",
            background_color: "#F4F6F9",

                { src: "https://placehold.co/192x192/138A36/FFFFFF?text=IPM", sizes: "192x192", type: "image/png" },
                { src: "https://placehold.co/512x512/138A36/FFFFFF?text=IPM", sizes: "512x512", type: "image/png" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const metaManifest = document.createElement('link');
        metaManifest.rel = 'manifest';
        metaManifest.href = manifestURL;
        document.head.appendChild(metaManifest);

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            const swURL = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swURL).catch(err => console.log('SW error:', err));
        }
    </script>

        // ==========================================
        // WEB AUDIO API SOUND EFFECTS SYNTHESIZER
        // ==========================================
        let audioCtx = null;
        let soundMuted = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.playBeep = function(freq = 440, type = 'sine', duration = 0.2) {
            if (soundMuted) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        window.playCountdownTone = function(step) {
            if (step === 3) playBeep(300, 'square', 0.3);
            else if (step === 2) playBeep(450, 'square', 0.3);
            else if (step === 1) playBeep(600, 'square', 0.3);
            else playBeep(880, 'triangle', 0.8);
        }

        window.playDrumRollSound = function(onComplete) {
            if (soundMuted) { if(onComplete) onComplete(); return; }
            try {
                const ctx = getAudioContext();
                let count = 0;
                const interval = setInterval(() => {
                    playBeep(120 + Math.random()*40, 'triangle', 0.08);
                    count++;
                    if (count > 15) {
                        clearInterval(interval);
                        playBeep(523.25, 'sine', 0.5); // C5 victory note
                        if (onComplete) onComplete();
                    }
                }, 100);
            } catch(e) { if(onComplete) onComplete(); }
        }

        function startCountdownTimer() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            const updateTimer = () => {
                const now = new Date().getTime();
                const target = new Date(appState.settings.endTime).getTime();
                const distance = target - now;
                const timerDisplay = document.getElementById('timer-display');
                if (!timerDisplay) return;

                if (distance < 0) {
                    timerDisplay.innerText = "WAKTU PEMILIHAN SELESAI";
                    return;
                }
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                timerDisplay.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            };
            updateTimer();
            appState.timerInterval = setInterval(updateTimer, 1000);
        }

        window.handleVoterLogin = function(scannedId = null) {
            const idInput = scannedId || document.getElementById('voter-id-input').value.trim().toUpperCase();

            if (!idInput) {
                if(errEl) { errEl.innerText = "Masukkan ID Pemilih dengan benar!"; errEl.classList.remove('hidden'); }
                return;
            }
            const voter = appState.dpt.find(d => d.id.toUpperCase() === idInput);
            if (!voter) {
                if(errEl) { errEl.innerText = "ID Pemilih tidak terdaftar di DPT!"; errEl.classList.remove('hidden'); }
                return;
            }
            if (voter.status === 'Sudah') {
                if(errEl) { errEl.innerText = "ID Pemilih ini telah digunakan untuk memilih!"; errEl.classList.remove('hidden'); }
                return;
            }
            appState.currentUser = voter;

            renderBallotPaperView();

            setTimeout(() => {

                html5QrCode.start(
                    { facingMode: "environment" },

        window.toggleSelectCandidate = function(id) {
            const index = appState.selectedCandidates.indexOf(id);

            const btn = document.getElementById(`btn-select-${id}`);

            if (index > -1) {
                appState.selectedCandidates.splice(index, 1);
                card.classList.remove('border-ipmGreen', 'shadow-xl', 'bg-ipmGreen/5');
                btn.className = "w-full py-2.5 rounded-xl font-bold text-sm transition shadow-sm border border-ipmGreen text-ipmGreen hover:bg-ipmGreen hover:text-white";

                    showModal("Batas Pilihan", "Anda hanya diperbolehkan memilih <strong class='text-ipmGreen'>TEPAT 3 KANDIDAT</strong>.");

                appState.selectedCandidates.push(id);

                                    <div class="mb-4">
                                        <label class="block text-xs font-bold text-slate-600 mb-1">Ganti Foto (Kompres Otomatis)</label>
                                        <input type="file" id="file-${c.id}" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-ipmGreen/10 file:text-ipmGreen hover:file:bg-ipmGreen/20">
                                    </div>
                                </div>
                                <button onclick="saveCandidateChanges('${c.id}')" class="w-full bg-ipmGreen hover:bg-ipmGreenDark text-white font-bold py-2 rounded-xl text-xs transition shadow">
                                    Simpan Perubahan Paslon
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.saveCandidateChanges = function(id) {
            const cand = appState.candidates.find(c => c.id === id);
            const newVisi = document.getElementById(`visi-${id}`).value;
            const fileInput = document.getElementById(`file-${id}`);
            cand.visi = newVisi;

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 300, maxHeight = 400;
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } }
                        else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        cand.fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        persistData();
                        showModal("Sukses", `Data dan foto kandidat ${cand.nama} berhasil diperbarui!`);
                        renderAdminDashboard();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                persistData();
                showModal("Sukses", `Data visi misi kandidat ${cand.nama} berhasil diperbarui!`);
                renderAdminDashboard();
            }
        }

        // ==========================================
        // TAB 5: DAFTAR HADIR (DPT & GENERATOR ACAK)
        // ==========================================
        function renderTabDpt(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="glass-card p-6 rounded-2xl shadow-sm flex flex-col xl:flex-row justify-between items-center gap-4">
                        <div class="w-full xl:w-auto flex-grow max-w-md">
                            <input type="text" id="dpt-search" oninput="filterDptTable()" placeholder="Cari ID Pemilih atau Nama..." class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-ipmGreen focus:outline-none">
                        </div>
                        <div class="flex flex-wrap gap-2.5">
                            <button onclick="openGenerateDptModal()" class="bg-ipmYellow hover:bg-ipmYellowDark text-slate-900 font-bold px-4 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate DPT Acak
                            </button>
                            <button onclick="openAddDptModal()" class="bg-ipmGreen hover:bg-ipmGreenDark text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                                <i class="fa-solid fa-user-plus"></i> Tambah Pemilih DPT
                            </button>
                            <button onclick="downloadAllQrCards()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                                <i class="fa-solid fa-qrcode"></i> Cetak Semua Kartu QR
                            </button>
                        </div>
                    </div>
                    <div class="glass-card rounded-2xl shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                                        <th class="p-4">ID Pemilih</th>
                                        <th class="p-4">Nama Pemilih</th>
                                        <th class="p-4">Kategori</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Waktu Rekam</th>
                                        <th class="p-4 text-center">Aksi QR</th>
                                    </tr>
                                </thead>
                                <tbody id="dpt-table-body" class="divide-y divide-slate-200">
                                    ${renderDptRows(appState.dpt)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        window.renderDptRows = function(list) {
            return list.map(d => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 font-mono font-bold text-ipmGreenDark">${d.id}</td>
                    <td class="p-4 font-medium text-slate-900">${d.nama}</td>
                    <td class="p-4"><span class="bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full text-xs font-semibold">${d.kategori}</span></td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${d.status === 'Sudah' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">${d.status}</span></td>
                    <td class="p-4 text-slate-500">${d.votedAt}</td>
                    <td class="p-4 text-center">
                        <button onclick="showQrCard('${d.id}', '${d.nama}')" class="bg-ipmYellow/20 hover:bg-ipmYellow text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold transition"><i class="fa-solid fa-qrcode mr-1"></i> Kartu QR</button>
                    </td>
                </tr>
            `).join('');
        }

        window.filterDptTable = function() {
            const query = document.getElementById('dpt-search').value.toLowerCase();
            const filtered = appState.dpt.filter(d => d.id.toLowerCase().includes(query) || d.nama.toLowerCase().includes(query));
            document.getElementById('dpt-table-body').innerHTML = renderDptRows(filtered);
        }

        window.openAddDptModal = function() {
            showModal("Tambah Pemilih DPT Baru", `
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">ID Pemilih / NIS</label>
                        <input type="text" id="new-dpt-id" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm uppercase" placeholder="Contoh: IPM005">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="new-dpt-nama" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" placeholder="Nama siswa/pendidik">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Kategori</label>
                        <select id="new-dpt-kategori" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                            <option value="Siswa">Siswa</option>
                            <option value="Pendidik">Pendidik</option>
                        </select>
                    </div>
                </div>
            `, () => {
                const id = document.getElementById('new-dpt-id').value.trim().toUpperCase();
                const nama = document.getElementById('new-dpt-nama').value.trim();
                const kategori = document.getElementById('new-dpt-kategori').value;
                if (!id || !nama) { showModal("Error", "ID dan Nama pemilih wajib diisi!"); return; }
                if (appState.dpt.some(d => d.id === id)) { showModal("Error", "ID Pemilih sudah terdaftar!"); return; }
                appState.dpt.push({ id, nama, kategori, status: 'Belum', votedAt: '-' });
                persistData();
                renderAdminDashboard();
                showModal("Sukses", `Pemilih ${nama} berhasil ditambahkan.`);
            }, true, "Tambah Pemilih");
        }

        window.openGenerateDptModal = function() {
            showModal("Generate Acak DPT Pemilih", `
                <div class="space-y-3">
                    <p class="text-xs text-slate-600">Fitur ini membuat data pemilih DPT acak secara instan.</p>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Jumlah Pemilih</label>
                        <input type="number" id="gen-count" value="30" min="1" max="200" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
            `, () => {
                const countVal = parseInt(document.getElementById('gen-count').value) || 30;
                const firstNames = ["Ahmad", "Muhammad", "Siti", "Nur", "Fauzan", "Rizki", "Putri", "Aisyah", "Zaki", "Nabila", "Dimas", "Aurel", "Farhan", "Dewi"];
                const lastNames = ["Pratama", "Ramadhan", "Hidayat", "Saputra", "Wahyudi", "Kusuma", "Lestari", "Anggraini", "Santoso", "Wijaya"];
                const classes = ["7a", "7b", "8a", "8b", "8e", "8f", "9a", "9b"];
                let addedCount = 0;
                let seed = Math.floor(Math.random() * 9000) + 100;

                for (let i = 0; i < countVal; i++) {
                    const fName = firstNames[Math.floor(Math.random() * firstNames.length)];
                    const lName = lastNames[Math.floor(Math.random() * lastNames.length)];
                    const cls = classes[Math.floor(Math.random() * classes.length)];
                    const genId = `IPM${String(seed + i).padStart(3, '0')}`;
                    if (!appState.dpt.some(d => d.id === genId)) {
                        appState.dpt.push({ id: genId, nama: `${fName} ${lName} (${cls.toUpperCase()})`, kategori: 'Siswa', status: 'Belum', votedAt: '-' });
                        addedCount++;
                    }
                }
                persistData();
                renderAdminDashboard();
                showModal("Sukses", `Berhasil membuat ${addedCount} data pemilih DPT baru.`);
            }, true, "Generate Sekarang");
        }

        window.showQrCard = function(id, nama) {
            showModal(`Kartu Pemilih: ${nama}`, `
                <div class="text-center space-y-3">
                    <div id="modal-qrcode" class="flex justify-center p-4 bg-white border border-slate-200 rounded-2xl shadow-inner inline-block"></div>
                    <div>
                        <h4 class="font-bold text-base text-slate-950">${nama}</h4>
                        <p class="text-xs font-mono text-ipmGreenDark font-bold">ID: ${id}</p>
                    </div>
                </div>
            `, null, false, "Tutup");

            setTimeout(() => {
                const qrContainer = document.getElementById('modal-qrcode');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, { text: id, width: 180, height: 180, colorDark: "#138A36", colorLight: "#ffffff" });
            }, 200);
        }

        window.downloadAllQrCards = function() {
            let printWindow = window.open('', '_blank');
            let html = `<html><head><title>Cetak Kartu QR DPT</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script><style>body{font-family:sans-serif;padding:20px}.card{border:2px dashed #138A36;padding:15px;margin:10px;display:inline-block;width:220px;text-align:center;border-radius:10px}@media print{button{display:none}}</style></head><body>`;
            html += `<h2>Kartu QR Pemilih DPT - IPM Merauke</h2><button onclick="window.print()" style="padding:10px 20px;background:#138A36;color:#fff;border:none;border-radius:5px;cursor:pointer;margin-bottom:20px">Cetak Sekarang</button><div style="display:flex;flex-wrap:wrap;gap:15px">`;
            appState.dpt.forEach(d => {
                html += `<div class="card"><h4>${d.nama}</h4><p style="font-family:monospace;font-weight:bold;color:#138A36">ID: ${d.id}</p><div id="qr-${d.id}" style="display:inline-block;margin:10px 0"></div></div>`;
            });
            html += `</div><script>`;
            appState.dpt.forEach(d => {
                html += `new QRCode(document.getElementById("qr-${d.id}"), { text: "${d.id}", width: 120, height: 120 });`;
            });
            html += `<\/script></body></html>`;
            printWindow.document.write(html);
            printWindow.document.close();
        }

        // ==========================================
        // TAB 6: PENGATURAN & BAP
        // ==========================================
        function renderTabSettings(container) {
            const currentEnd = new Date(appState.settings.endTime).toISOString().slice(0, 16);
            container.innerHTML = `
                <div class="space-y-6 max-w-2xl">
                    <div class="glass-card p-6 rounded-2xl shadow-sm space-y-4">
                        <h3 class="font-bold text-base text-slate-900"><i class="fa-solid fa-clock mr-1 text-ipmGreen"></i> Waktu Berakhir Pemilihan</h3>
                        <div>
                            <input type="datetime-local" id="setting-datetime" value="${currentEnd}" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-ipmGreen focus:outline-none">
                        </div>
                        <button onclick="saveDatetimeSetting()" class="bg-ipmGreen hover:bg-ipmGreenDark text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow">Perbarui Waktu</button>
                    </div>

                    <div class="glass-card p-6 rounded-2xl shadow-sm space-y-4">
                        <h3 class="font-bold text-base text-slate-900"><i class="fa-solid fa-file-lines mr-1 text-ipmYellow"></i> Ekspor Berita Acara (BAP) .txt</h3>
                        <button onclick="exportBapTxt()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> Unduh Berita Acara (.txt)
                        </button>
                    </div>

                    <div class="glass-card p-6 rounded-2xl shadow-sm border border-red-200 bg-red-50/30 space-y-4">
                        <h3 class="font-bold text-base text-red-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Reset Seluruh Database</h3>
                        <button onclick="promptResetDatabase()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                            <i class="fa-solid fa-trash-can"></i> Reset Database (Ketik HAPUS)
                        </button>
                    </div>
                </div>
            `;
        }

        window.saveDatetimeSetting = function() {
            const val = document.getElementById('setting-datetime').value;
            if (!val) return;
            appState.settings.endTime = new Date(val).toISOString();
            persistData();
            startCountdownTimer();
            showModal("Sukses", "Batas waktu pemilihan diperbarui.");
        }

        window.exportBapTxt = function() {
            const totalVoters = appState.dpt.length;
            const votedCount = appState.dpt.filter(d => d.status === 'Sudah').length;
            const sorted = [...appState.candidates].sort((a, b) => b.suara - a.suara);

            let txt = `BERITA ACARA E-VOTING MUSYRAN PR IPM SMP MUHAMMADIYAH MERAUKE\nWaktu: ${new Date().toLocaleString()}\n\n`;
            txt += `Total DPT: ${totalVoters} | Suara Masuk: ${votedCount}\n\nPEROLEHAN SUARA:\n`;
            sorted.forEach((c, i) => { txt += `${i+1}. ${c.nama} - ${c.suara} Suara\n`; });

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `BAP_Musyran_IPM_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        window.promptResetDatabase = function() {
            showModal("Konfirmasi Reset", `
                <p class="text-red-600 font-bold mb-2">PERINGATAN!</p>
                <p class="text-xs text-slate-700 mb-4">Ketik kata <strong class="text-red-600">HAPUS</strong> untuk mereset seluruh database suara:</p>
            `, () => {
                appState.candidates.forEach(c => c.suara = 0);
                appState.dpt.forEach(d => { d.status = 'Belum'; d.votedAt = '-'; });
                persistData();
                renderAdminDashboard();
                showModal("Reset Berhasil", "Database dikembalikan ke awal.");
            }, true, "Reset Sekarang", {
                label: "Ketik HAPUS",
                placeholder: "HAPUS",
                validator: (val) => {
                    if (val !== "HAPUS") { showModal("Gagal", "Konfirmasi gagal!"); return false; }
                    return true;
                }
            });
        }

        window.onload = function() {
            initData();
        };
    </script>
</body>
</html>
