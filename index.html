    <!-- PWA Service Worker Injection -->
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            const swURL = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swURL).catch(err => console.log('SW skip:', err));
        }
    </script>

    <!-- Firebase SDK v10.12.2 Modular & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // ==========================================
        // KONFIGURASI APLIKASI (PRODUCTION)
        // ==========================================
        const IS_PREVIEW = false;

        const firebaseConfig = {
            apiKey: "AIzaSyAQM_QOBTrZnXZ7aLOXR_5G7sQ49hTybDg",
  authDomain: "e-voting-pr-ipm-smpmuhmrk.firebaseapp.com",
  projectId: "e-voting-pr-ipm-smpmuhmrk",
  storageBucket: "e-voting-pr-ipm-smpmuhmrk.firebasestorage.app",
  messagingSenderId: "143987307193",
  appId: "1:143987307193:web:39eeeabe1cc10046e4a168",
  measurementId: "G-NETBZGN7FH", 
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State Aplikasi Global (Real-time dari Firestore)
        let appState = {
            candidates: [],
            dpt: [],
            settings: {
                endTime: new Date(Date.now() + 8 * 3600 * 1000).toISOString(),
                isLocked: false
            },
            homeConfig: {
                orgName: 'PR IPM SMP MUHAMMADIYAH MERAUKE',
                orgSubtitle: 'Musyawarah Ranting (MUSYRAN) Pemilihan Formatur',
                boothTitle: 'Bilik Suara Digital',
                boothSubtitle: 'Musyran PR IPM SMP Muhammadiyah Merauke',
                welcomeNotice: 'Gunakan Kode Akses Pemilih yang telah diberikan oleh panitia pemilihan.',
                primaryColor: '#138A36',
                accentColor: '#FFCC00',
                bgImageUrl: '',
                logoUrl: ''
            },
            coreOfficers: { ketua: '', sekretaris: '', bendahara: '' },
            announcementStatus: { top3: 'belum', core: 'belum' },
            currentUser: null,
            selectedCandidates: [],
            adminUser: null,
            activeAdminTab: 'live',
            timerInterval: null,
            initialLoaded: false
        };

        // ==========================================
        // SINKRONISASI REAL-TIME FIRESTORE
        // ==========================================
        function initFirebaseListeners() {
            // 1. Pantau Status Login Admin Firebase Auth
            onAuthStateChanged(auth, (user) => {
                appState.adminUser = user;
                const adminBtn = document.getElementById('admin-nav-btn');
                if (adminBtn) {
                    if (user) {
                        adminBtn.innerHTML = `<i class="fa-solid fa-gauge-high"></i> Panel Admin`;
                    } else {
                        adminBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Admin Dasbor`;
                    }
                }
            });

            // 2. Listener Pengaturan & Tampilan Halaman Utama (config/main)
            onSnapshot(doc(db, 'config', 'main'), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.settings) appState.settings = { ...appState.settings, ...data.settings };
                    if (data.homeConfig) appState.homeConfig = { ...appState.homeConfig, ...data.homeConfig };
                    if (data.coreOfficers) appState.coreOfficers = { ...appState.coreOfficers, ...data.coreOfficers };
                    if (data.announcementStatus) appState.announcementStatus = { ...appState.announcementStatus, ...data.announcementStatus };
                }
                applyThemeAndBranding();
                startCountdownTimer();

                // Render ulang tampilan aktif jika berada di halaman login pemilih
                if (appState.initialLoaded && !appState.currentUser && !appState.adminUser) {
                    renderVoterLoginView();
                }
            }, (error) => {
                console.error("Error config listener:", error);
            });

            // 3. Listener Data Kandidat / Paslon (koleksi: candidates)
            onSnapshot(collection(db, 'candidates'), (snapshot) => {
                const list = [];
                snapshot.forEach(docItem => {
                    list.push({ id: docItem.id, ...docItem.data() });
                });
                list.sort((a, b) => (Number(a.nomor) || 0) - (Number(b.nomor) || 0));
                appState.candidates = list;

                if (appState.adminUser && (appState.activeAdminTab === 'live' || appState.activeAdminTab === 'paslon')) {
                    loadAdminTabContent();
                }
            });

            // 4. Listener Data DPT (koleksi: dpt)
            onSnapshot(collection(db, 'dpt'), (snapshot) => {
                const list = [];
                snapshot.forEach(docItem => {
                    list.push({ id: docItem.id, ...docItem.data() });
                });
                list.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
                appState.dpt = list;

                if (!appState.initialLoaded) {
                    appState.initialLoaded = true;
                    document.getElementById('app-loader').classList.add('hidden');
                    document.getElementById('app-view').classList.remove('hidden');
                    renderVoterLoginView();
                } else if (appState.adminUser && (appState.activeAdminTab === 'live' || appState.activeAdminTab === 'dpt')) {
                    loadAdminTabContent();
                }
            });
        }

        function applyThemeAndBranding() {
            const cfg = appState.homeConfig;
            document.documentElement.style.setProperty('--primary-color', cfg.primaryColor || '#138A36');
            document.documentElement.style.setProperty('--accent-color', cfg.accentColor || '#FFCC00');

            const titleEl = document.getElementById('header-org-title');
            const subEl = document.getElementById('header-org-subtitle');
            const logoContainer = document.getElementById('header-logo-container');
            const wrapper = document.getElementById('blogger-fullscreen-wrapper');

            if (titleEl) titleEl.innerText = cfg.orgName;
            if (subEl) subEl.innerText = cfg.orgSubtitle;

            if (logoContainer) {
                if (cfg.logoUrl && cfg.logoUrl.trim() !== '') {
                    logoContainer.innerHTML = `<img src="${cfg.logoUrl}" alt="Logo" class="w-full h-full object-contain">`;
                } else {
                    logoContainer.innerHTML = `<i class="fa-solid fa-box-archive"></i>`;
                }
            }

            if (wrapper) {
                if (cfg.bgImageUrl && cfg.bgImageUrl.trim() !== '') {
                    wrapper.style.backgroundImage = `linear-gradient(rgba(244, 246, 249, 0.88), rgba(244, 246, 249, 0.92)), url('${cfg.bgImageUrl}')`;
                    wrapper.style.backgroundSize = 'cover';
                    wrapper.style.backgroundPosition = 'center';
                    wrapper.style.backgroundAttachment = 'fixed';
                } else {
                    wrapper.style.backgroundImage = 'none';
                    wrapper.style.backgroundColor = '#F4F6F9';
                }
            }
        }

        // ==========================================
        // WEB AUDIO API SOUND EFFECTS SYNTHESIZER
        // ==========================================
        let audioCtx = null;
        let soundMuted = false;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        window.playBeep = function(freq = 440, type = 'sine', duration = 0.2) {
            if (soundMuted) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        window.playCountdownTone = function(step) {
            if (step === 3) playBeep(300, 'square', 0.3);
            else if (step === 2) playBeep(450, 'square', 0.3);
            else if (step === 1) playBeep(600, 'square', 0.3);
            else playBeep(880, 'triangle', 0.8);
        }

        window.playDrumRollSound = function(onComplete) {
            if (soundMuted) { if(onComplete) onComplete(); return; }
            try {
                let count = 0;
                const interval = setInterval(() => {
                    playBeep(120 + Math.random()*40, 'triangle', 0.08);
                    count++;
                    if (count > 15) {
                        clearInterval(interval);
                        playBeep(523.25, 'sine', 0.5);
                        if (onComplete) onComplete();
                    }
                }, 100);
            } catch(e) { if(onComplete) onComplete(); }
        }

        window.playVictoryFanfare = function() {
            if (soundMuted) return;
            try {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => playBeep(freq, 'sine', 0.4), idx * 200);
                });
            } catch(e) {}
        }

        window.toggleSoundMute = function() {
            soundMuted = !soundMuted;
            const btn1 = document.getElementById('sound-toggle-btn');
            const btn2 = document.getElementById('sound-toggle-btn-core');
            const html = soundMuted
                ? '<i class="fa-solid fa-volume-xmark text-red-500"></i> Suara Mati'
                : '<i class="fa-solid fa-volume-high text-green-500"></i> Suara Hidup';
            if (btn1) btn1.innerHTML = html;
            if (btn2) btn2.innerHTML = html;
        }

        // ==========================================
        // MODAL SYSTEM
        // ==========================================
        window.showModal = function(title, htmlContent, onConfirm = null, showCancel = false, confirmText = "Mengerti", inputConfig = null) {
            document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-circle-info"></i> ${title}`;
            document.getElementById('modal-body').innerHTML = htmlContent;
            
            const extraContainer = document.getElementById('modal-extra-input-container');
            const extraInput = document.getElementById('modal-extra-input');
            const inputLabel = document.getElementById('modal-input-label');
            
            if (inputConfig) {
                extraContainer.classList.remove('hidden');
                inputLabel.innerText = inputConfig.label;
                extraInput.value = '';
                extraInput.placeholder = inputConfig.placeholder || '';
            } else {
                extraContainer.classList.add('hidden');
            }

            const btnCancel = document.getElementById('modal-btn-cancel');
            const btnConfirm = document.getElementById('modal-btn-confirm');
            
            if (showCancel) btnCancel.classList.remove('hidden');
            else btnCancel.classList.add('hidden');

            btnConfirm.innerText = confirmText;
            btnConfirm.onclick = () => {
                if (inputConfig && inputConfig.validator) {
                    const val = extraInput.value.trim();
                    if (!inputConfig.validator(val)) return;
                }
                const val = extraInput.value.trim();
                closeModal();
                if (onConfirm) onConfirm(val);
            };

            document.getElementById('custom-modal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function startCountdownTimer() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            const updateTimer = () => {
                const now = new Date().getTime();
                const target = new Date(appState.settings.endTime).getTime();
                const distance = target - now;
                const timerDisplay = document.getElementById('timer-display');
                if (!timerDisplay) return;

                if (isNaN(target) || distance < 0) {
                    timerDisplay.innerText = "WAKTU PEMILIHAN SELESAI";
                    return;
                }
                const hours = Math.floor(distance / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                timerDisplay.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            };
            updateTimer();
            appState.timerInterval = setInterval(updateTimer, 1000);
        }

        // ==========================================
        // 1. HALAMAN UTAMA / PEMILIH (BILIK SUARA)
        // ==========================================
        window.renderVoterLoginView = function() {
            appState.currentUser = null;
            const cfg = appState.homeConfig;
            const view = document.getElementById('app-view');
            view.innerHTML = `
                <div style="border-top-color: var(--primary-color);" class="max-w-md mx-auto mt-8 sm:mt-12 glass-card p-8 rounded-3xl shadow-xl border-t-4 animate-fade-in">
                    <div class="text-center mb-6">
                        <div style="color: var(--primary-color); background-color: rgba(19, 138, 54, 0.1);" class="inline-flex p-4 rounded-full text-3xl mb-3 shadow-inner overflow-hidden w-16 h-16 items-center justify-center">
                            ${cfg.logoUrl ? `<img src="${cfg.logoUrl}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-person-booth"></i>`}
                        </div>
                        <h2 class="text-2xl font-black text-slate-900">${cfg.boothTitle}</h2>
                        <p class="text-xs text-slate-500 mt-1">${cfg.boothSubtitle}</p>
                        ${cfg.welcomeNotice ? `<div class="mt-3 bg-slate-100/90 border border-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl">${cfg.welcomeNotice}</div>` : ''}
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Kode Akses Pemilih</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-key"></i></span>
                                <input type="text" id="voter-id-input" onkeydown="if(event.key==='Enter') handleVoterLogin()" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-bold tracking-wider focus:ring-2 focus:ring-ipmGreen focus:outline-none uppercase" placeholder="Masukkan Kode Acak Anda">
                            </div>
                            <p id="login-error-msg" class="text-xs text-red-600 font-semibold mt-1.5 hidden"></p>
                        </div>
                        <button onclick="handleVoterLogin()" style="background-color: var(--primary-color);" class="w-full hover:opacity-95 text-white font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                            <span>Masuk Bilik Suara</span> <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <div class="relative flex py-2 items-center">
                            <div class="flex-grow border-t border-slate-200"></div>
                            <span class="flex-shrink mx-4 text-slate-400 text-xs">Atau Scan QR Code Kartu</span>
                            <div class="flex-grow border-t border-slate-200"></div>
                        </div>
                        <button onclick="openQrScannerModal()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                            <i class="fa-solid fa-qrcode"></i> Scan QR Kartu Pemilih
                        </button>
                    </div>
                </div>
            `;
        }

        window.handleVoterLogin = function(scannedCode = null) {
            const codeInput = (scannedCode || document.getElementById('voter-id-input').value || '').trim().toUpperCase();
            const errEl = document.getElementById('login-error-msg');
            
            const now = new Date().getTime();
            const end = new Date(appState.settings.endTime).getTime();
            if (now > end) {
                if(errEl) { errEl.innerText = "Waktu pemilihan telah berakhir!"; errEl.classList.remove('hidden'); }
                return;
            }

            if (!codeInput) {
                if(errEl) { errEl.innerText = "Masukkan Kode Akses Pemilih dengan benar!"; errEl.classList.remove('hidden'); }
                return;
            }

            const voter = appState.dpt.find(d => (d.kode || d.id || '').toUpperCase() === codeInput);
            if (!voter) {

        window.toggleSelectCandidate = function(id, requiredVotes) {
            const index = appState.selectedCandidates.indexOf(id);
            const card = document.getElementById(`card-${id}`);
            const btn = document.getElementById(`btn-select-${id}`);

            if (index > -1) {
                appState.selectedCandidates.splice(index, 1);
                card.style.borderColor = 'transparent';
                card.classList.remove('shadow-xl');
                btn.style.backgroundColor = 'transparent';
                btn.style.color = 'var(--primary-color)';
                btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> COBLOS';
            } else {
                if (appState.selectedCandidates.length >= requiredVotes) {
                    showModal("Batas Pilihan", `Anda hanya diperbolehkan memilih <strong>TEPAT ${requiredVotes} KANDIDAT</strong>.`);
                    return;

                appState.selectedCandidates.push(id);
                card.style.borderColor = 'var(--primary-color)';
                card.classList.add('shadow-xl');
                btn.style.backgroundColor = 'var(--primary-color)';
                btn.style.color = '#ffffff';
                btn.innerHTML = '<i class="fa-solid fa-square-check mr-1"></i> TERPILIH';

            if (appState.selectedCandidates.length === requiredVotes) {

            const names = appState.selectedCandidates.map(id => appState.candidates.find(c => c.id === id)?.nama || '').join(', ');

            showModal("Konfirmasi Pilihan Suara", `

                try {
                    const batch = writeBatch(db);
                    appState.selectedCandidates.forEach(candId => {
                        const candRef = doc(db, 'candidates', candId);
                        batch.update(candRef, { suara: increment(1) });
                    });

                    const voterRef = doc(db, 'dpt', appState.currentUser.id);
                    batch.update(voterRef, {
                        status: 'Sudah',
                        votedAt: new Date().toLocaleTimeString('id-ID')

                    renderSuccessView();

        function compressImageFile(file, maxWidth, maxHeight, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

            `, async () => {
                const rawText = document.getElementById('batch-dpt-names').value;
                const names = rawText.split('\n').map(n => n.trim()).filter(n => n.length > 0);
                if (names.length === 0) {
                    showModal("Gagal", "Daftar nama masih kosong!");
                    return;
                }

                const existingCodes = new Set(appState.dpt.map(d => (d.kode || d.id).toUpperCase()));
                const batch = writeBatch(db);
                let added = 0;

                names.forEach(nama => {
                    let kode = generateRandomAccessCode();
                    while (existingCodes.has(kode)) {
                        kode = generateRandomAccessCode();
                    }
                    existingCodes.add(kode);
                    const docRef = doc(db, 'dpt', kode);
                    batch.set(docRef, {
                        nama,
                        kode,
                        status: 'Belum',
                        votedAt: '-'
                    });
                    added++;
                });

                await batch.commit();
                showModal("Sukses", `Berhasil menambahkan <strong>${added} pemilih</strong> lengkap dengan kode acak unik.`);

        let annTop3State = { step: 0, timer: null, paused: false };

        window.launchTop3Announcement = function() {
            if (appState.candidates.length < 3) {
                showModal("Data Belum Lengkap", "Minimal harus ada 3 kandidat terdaftar untuk memulai pengumuman 3 besar.");
                return;
            }
            annTop3State = { step: 0, timer: null, paused: false };
            const totalSuara = appState.candidates.reduce((sum, c) => sum + (c.suara || 0), 0);
            const sorted = [...appState.candidates].sort((a, b) => (b.suara || 0) - (a.suara || 0));
            const isTie = sorted[0] && sorted[1] && (sorted[0].suara || 0) === (sorted[1].suara || 0) && (sorted[0].suara || 0) > 0;

            const view = document.getElementById('app-view');
            view.innerHTML = `
                <div id="announcement-theater" class="fixed inset-0 z-[99995] bg-slate-950 text-white flex flex-col justify-between p-6 select-none overflow-y-auto">

                            <button onclick="top3AnnRepeat()" class="bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"><i class="fa-solid fa-rotate-right"></i> Ulangi</button>

                    </div>
                </div>
            `;

            runTop3Step(0, sorted, totalSuara, isTie);
        }

        function runTop3Step(step, sorted, totalSuara, isTie) {
            annTop3State.step = step;
            const body = document.getElementById('theater-body');
            if (!body) return;

            if (step === 0) {
                playBeep(440, 'sine', 0.5);
                body.innerHTML = `
                    <div class="animate-fade-in space-y-4">
                        <div style="background-color: var(--primary-color);" class="inline-block text-white px-6 py-2 rounded-full font-bold text-sm mb-2 shadow-lg">MUSYAWARAH RANTING (MUSYRAN)</div>
                        <h1 style="color: var(--accent-color);" class="text-4xl sm:text-6xl font-black tracking-tight">HASIL PEMILIHAN FORMATUR</h1>
                        <p class="text-slate-400 text-sm max-w-xl mx-auto">${appState.homeConfig.orgName}</p>
                    </div>
                `;
                annTop3State.timer = setTimeout(() => { if(!annTop3State.paused) runTop3Step(1, sorted, totalSuara, isTie); }, 4000);
            } else if (step === 1) {
                runCountdownAnimation(3, () => {
                    if(!annTop3State.paused) runTop3Step(2, sorted, totalSuara, isTie);
                });
            } else if (step === 2) {
                const c3 = sorted[2];
                const pct3 = totalSuara > 0 ? (((c3.suara || 0) / totalSuara) * 100).toFixed(1) : 0;
                playDrumRollSound();
                body.innerHTML = `
                    <div class="animate-fade-in space-y-6">
                        <span class="bg-amber-700 text-white font-black px-4 py-1.5 rounded-full text-sm shadow">PERINGKAT KETIGA (#3)</span>

                            <span class="text-xs text-slate-400 block">Perolehan Suara</span>
                            <strong style="color: var(--accent-color);" class="text-2xl font-black">${c3.suara || 0} Suara (${pct3}%)</strong>
                        </div>
                    </div>
                `;
                annTop3State.timer = setTimeout(() => { if(!annTop3State.paused) runTop3Step(3, sorted, totalSuara, isTie); }, 6000);
            } else if (step === 3) {
                const c2 = sorted[1];
                const pct2 = totalSuara > 0 ? (((c2.suara || 0) / totalSuara) * 100).toFixed(1) : 0;
                playDrumRollSound();
                body.innerHTML = `
                    <div class="animate-fade-in space-y-6">
                        <span class="bg-slate-300 text-slate-900 font-black px-4 py-1.5 rounded-full text-sm shadow">PERINGKAT KEDUA (#2)</span>
                        <div class="relative inline-block">
                            <div class="absolute inset-0 bg-slate-400 rounded-full blur-xl opacity-50 animate-spotlight"></div>
                            <img src="${c2.fotoBase64 || ''}" class="w-36 h-36 sm:w-44 sm:h-44 object-cover rounded-full mx-auto relative border-4 border-slate-300 shadow-2xl">
                        </div>
                        <div>
                            <h2 class="text-3xl sm:text-4xl font-black text-white">${c2.nama}</h2>
                            <p class="text-slate-400 text-sm mt-1">No. Urut #${c2.nomor}</p>
                        </div>
                        <div class="inline-block bg-slate-900 border border-slate-800 px-6 py-3 rounded-2xl shadow-xl">
                            <span class="text-xs text-slate-400 block">Perolehan Suara</span>
                            <strong style="color: var(--accent-color);" class="text-2xl font-black">${c2.suara || 0} Suara (${pct2}%)</strong>
                        </div>
                    </div>
                `;
                annTop3State.timer = setTimeout(() => { if(!annTop3State.paused) runTop3Step(4, sorted, totalSuara, isTie); }, 6000);
            } else if (step === 4) {
                const c1 = sorted[0];
                const pct1 = totalSuara > 0 ? (((c1.suara || 0) / totalSuara) * 100).toFixed(1) : 0;

                confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });

                body.innerHTML = `

                        <div class="relative inline-block">
                            <div style="background-color: var(--accent-color);" class="absolute inset-0 rounded-full blur-2xl opacity-60 animate-spotlight"></div>
                            <img src="${c1.fotoBase64 || ''}" style="border-color: var(--accent-color);" class="w-40 h-40 sm:w-52 sm:h-52 object-cover rounded-full mx-auto relative border-4 shadow-2xl">
                        </div>
                        <div>
                            <h2 style="color: var(--accent-color);" class="text-4xl sm:text-5xl font-black">${c1.nama}</h2>
                            <p class="text-slate-300 text-sm mt-1">No. Urut #${c1.nomor}</p>

                            <span class="text-xs text-slate-400 block">Perolehan Suara Tertinggi</span>
                            <strong style="color: var(--accent-color);" class="text-3xl font-black">${c1.suara || 0} Suara (${pct1}%)</strong>
                        </div>
                    </div>
                `;
                appState.announcementStatus.top3 = 'selesai';
                setDoc(doc(db, 'config', 'main'), { announcementStatus: appState.announcementStatus }, { merge: true });
            }
        }

        function runCountdownAnimation(currentNum, callback) {
            const body = document.getElementById('theater-body');
            if (!body) return;
            playCountdownTone(currentNum);
            body.innerHTML = `
                <div class="animate-fade-in space-y-4">
                    <p class="text-slate-400 uppercase tracking-widest text-sm">Menuju Pengumuman Pemenang</p>
                    <div style="color: var(--accent-color);" class="text-7xl sm:text-9xl font-black animate-pulse">${currentNum}</div>
                </div>
            `;
            if (currentNum > 1) {
                annTop3State.timer = setTimeout(() => { if(!annTop3State.paused) runCountdownAnimation(currentNum - 1, callback); }, 1000);
            } else {
                annTop3State.timer = setTimeout(() => { if(!annTop3State.paused) callback(); }, 1000);
            }
        }

        window.top3AnnPauseResume = function() {
            annTop3State.paused = !annTop3State.paused;
            const btn = document.getElementById('btn-pause-resume');
            if (annTop3State.paused) {
                clearTimeout(annTop3State.timer);
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Lanjutkan';
                btn.className = "bg-green-600 hover:bg-green-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5";
            } else {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Jeda';
                btn.className = "bg-amber-600 hover:bg-amber-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5";
                const sorted = [...appState.candidates].sort((a, b) => (b.suara || 0) - (a.suara || 0));
                const totalSuara = appState.candidates.reduce((sum, c) => sum + (c.suara || 0), 0);
                const isTie = sorted[0] && sorted[1] && (sorted[0].suara || 0) === (sorted[1].suara || 0);
                runTop3Step(annTop3State.step, sorted, totalSuara, isTie);
            }
        }

        window.top3AnnRepeat = function() {
            clearTimeout(annTop3State.timer);
            const sorted = [...appState.candidates].sort((a, b) => (b.suara || 0) - (a.suara || 0));
            const totalSuara = appState.candidates.reduce((sum, c) => sum + (c.suara || 0), 0);
            const isTie = sorted[0] && sorted[1] && (sorted[0].suara || 0) === (sorted[1].suara || 0);
            runTop3Step(0, sorted, totalSuara, isTie);
        }

        window.exitAnnouncementTheater = function() {
            clearTimeout(annTop3State.timer);
            clearTimeout(annCoreState.timer);
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            renderAdminDashboard();
        }

        window.confirmLaunchCoreAnnouncement = function() {
            const { ketua, sekretaris, bendahara } = appState.coreOfficers;
            if (!ketua || !sekretaris || !bendahara) {
                showModal("Belum Lengkap", "Pastikan 3 jabatan inti (Ketua, Sekretaris, Bendahara) telah ditetapkan melalui Tab Hasil Live sebelum memulai pelantikan!");
                return;
            }
            if (ketua === sekretaris || ketua === bendahara || sekretaris === bendahara) {
                showModal("Kesalahan Penetapan", "Terdapat perangkapan jabatan inti oleh orang yang sama.");
                return;
            }
            showModal("Konfirmasi Pelantikan", "Apakah Anda siap memulai Pelantikan 3 Pimpinan Inti?", () => {
                launchCoreAnnouncementTheater();
            }, true, "Mulai Pelantikan");
        }

        let annCoreState = { step: 0, timer: null, paused: false };

        window.launchCoreAnnouncementTheater = function() {
            annCoreState = { step: 0, timer: null, paused: false };
            const ketuaObj = appState.candidates.find(c => c.id === appState.coreOfficers.ketua);
            const sekrObj = appState.candidates.find(c => c.id === appState.coreOfficers.sekretaris);
            const bendObj = appState.candidates.find(c => c.id === appState.coreOfficers.bendahara);

            if (!ketuaObj || !sekrObj || !bendObj) {
                showModal("Data Tidak Ditemukan", "Salah satu kandidat pejabat inti sudah dihapus. Periksa kembali di Tab Hasil Live.");
                return;
            }

            const view = document.getElementById('app-view');
            view.innerHTML = `
                <div id="core-theater" class="fixed inset-0 z-[99995] bg-slate-950 text-white flex flex-col justify-between p-6 select-none overflow-y-auto">
                    <div class="flex flex-wrap justify-between items-center max-w-7xl mx-auto w-full bg-slate-900/80 p-4 rounded-2xl border border-slate-800 backdrop-blur gap-2">

                        </div>

                            <button onclick="coreAnnPauseResume()" id="btn-pause-resume-core" class="bg-amber-600 hover:bg-amber-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"><i class="fa-solid fa-pause"></i> Jeda</button>
                            <button onclick="coreAnnRepeat()" class="bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"><i class="fa-solid fa-rotate-right"></i> Ulangi</button>
                            <button onclick="toggleFullScreen()" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition"><i class="fa-solid fa-expand"></i></button>
                            <button onclick="exitAnnouncementTheater()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-xs font-bold transition"><i class="fa-solid fa-xmark"></i> Akhiri</button>
                        </div>
                    </div>
                    <div id="core-theater-body" class="flex-grow flex flex-col items-center justify-center max-w-5xl mx-auto w-full my-6 text-center"></div>
                    <div class="text-center text-xs text-slate-500">${appState.homeConfig.orgName}</div>
                </div>
            `;

            runCoreStep(0, ketuaObj, sekrObj, bendObj);
        }

        function runCoreStep(step, ketuaObj, sekrObj, bendObj) {
            annCoreState.step = step;
            const body = document.getElementById('core-theater-body');
            if (!body) return;

            if (step === 0) {
                playBeep(440, 'sine', 0.5);
                body.innerHTML = `
                    <div class="animate-fade-in space-y-4">
                        <div style="background-color: var(--accent-color);" class="inline-block text-slate-950 px-6 py-2 rounded-full font-black text-sm mb-2 shadow-lg">SIDANG PLENO & PELANTIKAN</div>
                        <h1 class="text-4xl sm:text-6xl font-black text-white tracking-tight">PIMPINAN INTI TERPILIH</h1>
                        <p style="color: var(--accent-color);" class="text-sm max-w-xl mx-auto">${appState.homeConfig.orgName}</p>
                    </div>
                `;
                annCoreState.timer = setTimeout(() => { if(!annCoreState.paused) runCoreStep(1, ketuaObj, sekrObj, bendObj); }, 4000);
            } else if (step === 1) {
                runCoreCountdown(3, () => { if(!annCoreState.paused) runCoreStep(2, ketuaObj, sekrObj, bendObj); });
            } else if (step === 2) {
                playDrumRollSound();
                body.innerHTML = `
                    <div class="animate-fade-in space-y-6">
                        <span class="bg-blue-600 text-white font-black px-5 py-2 rounded-full text-sm shadow">SEKRETARIS UMUM</span>
                        <div class="relative inline-block">
                            <div class="absolute inset-0 bg-blue-500 rounded-full blur-xl opacity-50 animate-spotlight"></div>
                            <img src="${sekrObj.fotoBase64 || ''}" class="w-36 h-36 sm:w-44 sm:h-44 object-cover rounded-full mx-auto relative border-4 border-blue-500 shadow-2xl">
                        </div>
                        <div>
                            <h2 class="text-3xl sm:text-4xl font-black text-white">${sekrObj.nama}</h2>
                            <p class="text-slate-400 text-sm mt-1">Sekretaris Umum Terpilih</p>
                        </div>
                    </div>
                `;
                annCoreState.timer = setTimeout(() => { if(!annCoreState.paused) runCoreStep(3, ketuaObj, sekrObj, bendObj); }, 6000);
            } else if (step === 3) {
                playDrumRollSound();
                body.innerHTML = `
                    <div class="animate-fade-in space-y-6">
                        <span style="background-color: var(--primary-color);" class="text-white font-black px-5 py-2 rounded-full text-sm shadow">BENDAHARA UMUM</span>
                        <div class="relative inline-block">
                            <div style="background-color: var(--primary-color);" class="absolute inset-0 rounded-full blur-xl opacity-50 animate-spotlight"></div>
                            <img src="${bendObj.fotoBase64 || ''}" style="border-color: var(--primary-color);" class="w-36 h-36 sm:w-44 sm:h-44 object-cover rounded-full mx-auto relative border-4 shadow-2xl">
                        </div>
                        <div>
                            <h2 class="text-3xl sm:text-4xl font-black text-white">${bendObj.nama}</h2>
                            <p class="text-slate-400 text-sm mt-1">Bendahara Umum Terpilih</p>
                        </div>
                    </div>
                `;
                annCoreState.timer = setTimeout(() => { if(!annCoreState.paused) runCoreStep(4, ketuaObj, sekrObj, bendObj); }, 6000);
            } else if (step === 4) {
                playVictoryFanfare();
                confetti({ particleCount: 250, spread: 120, origin: { y: 0.5 } });
                body.innerHTML = `
                    <div class="animate-fade-in space-y-6">
                        <span style="background-color: var(--accent-color);" class="text-slate-950 font-black px-6 py-2.5 rounded-full text-base shadow-lg animate-bounce">KETUA UMUM 🏆</span>
                        <div class="relative inline-block">
                            <div style="background-color: var(--accent-color);" class="absolute inset-0 rounded-full blur-2xl opacity-60 animate-spotlight"></div>
                            <img src="${ketuaObj.fotoBase64 || ''}" style="border-color: var(--accent-color);" class="w-44 h-44 sm:w-56 sm:h-56 object-cover rounded-full mx-auto relative border-4 shadow-2xl">
                        </div>
                        <div>
                            <h2 style="color: var(--accent-color);" class="text-4xl sm:text-6xl font-black">${ketuaObj.nama}</h2>
                            <p class="text-slate-300 text-base mt-1">Ketua Umum Terpilih</p>
                        </div>
                        <div class="bg-slate-900 border border-amber-400/40 px-6 py-3 rounded-2xl max-w-md mx-auto">
                            <p style="color: var(--accent-color);" class="text-xs font-bold">SELAMAT DAN SUKSES MENGEMBAN AMANAH</p>
                        </div>
                    </div>
                `;
                appState.announcementStatus.core = 'selesai';
                setDoc(doc(db, 'config', 'main'), { announcementStatus: appState.announcementStatus }, { merge: true });
            }
        }

        function runCoreCountdown(currentNum, callback) {
            const body = document.getElementById('core-theater-body');
            if (!body) return;
            playCountdownTone(currentNum);
            body.innerHTML = `
                <div class="animate-fade-in space-y-4">
                    <p class="text-slate-400 uppercase tracking-widest text-sm">Menuju Pengumuman Pimpinan Inti</p>
                    <div style="color: var(--accent-color);" class="text-7xl sm:text-9xl font-black animate-pulse">${currentNum}</div>
                </div>
            `;
            if (currentNum > 1) {
                annCoreState.timer = setTimeout(() => { if(!annCoreState.paused) runCoreCountdown(currentNum - 1, callback); }, 1000);
            } else {
                annCoreState.timer = setTimeout(() => { if(!annCoreState.paused) callback(); }, 1000);
            }
        }

        window.coreAnnPauseResume = function() {
            annCoreState.paused = !annCoreState.paused;
            const btn = document.getElementById('btn-pause-resume-core');
            if (annCoreState.paused) {
                clearTimeout(annCoreState.timer);
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Lanjutkan';
                btn.className = "bg-green-600 hover:bg-green-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5";
            } else {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Jeda';
                btn.className = "bg-amber-600 hover:bg-amber-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5";
                const ketuaObj = appState.candidates.find(c => c.id === appState.coreOfficers.ketua);
                const sekrObj = appState.candidates.find(c => c.id === appState.coreOfficers.sekretaris);
                const bendObj = appState.candidates.find(c => c.id === appState.coreOfficers.bendahara);
                runCoreStep(annCoreState.step, ketuaObj, sekrObj, bendObj);
            }
        }

        window.coreAnnRepeat = function() {
            clearTimeout(annCoreState.timer);
            const ketuaObj = appState.candidates.find(c => c.id === appState.coreOfficers.ketua);
            const sekrObj = appState.candidates.find(c => c.id === appState.coreOfficers.sekretaris);
            const bendObj = appState.candidates.find(c => c.id === appState.coreOfficers.bendahara);
            runCoreStep(0, ketuaObj, sekrObj, bendObj);
        }

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
        }

        // ==========================================
        // TAB 6: PENGATURAN WAKTU, BAP & RESET DATA
        // ==========================================
        function renderTabSettings(container) {
            const d = new Date(appState.settings.endTime);
            const localIso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

            container.innerHTML = `
                <div class="space-y-6 max-w-2xl">
                    <div class="glass-card p-6 rounded-2xl shadow-sm space-y-4">
                        <h3 class="font-bold text-base text-slate-900"><i style="color: var(--primary-color);" class="fa-solid fa-clock mr-1"></i> Waktu Berakhir Pemilihan</h3>
                        <div>
                            <input type="datetime-local" id="setting-datetime" value="${localIso}" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-ipmGreen focus:outline-none">
                        </div>
                        <button onclick="saveDatetimeSetting()" style="background-color: var(--primary-color);" class="text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow">Perbarui Waktu</button>
                    </div>

                    <div class="glass-card p-6 rounded-2xl shadow-sm space-y-4">
                        <h3 class="font-bold text-base text-slate-900"><i style="color: var(--accent-color);" class="fa-solid fa-file-lines mr-1"></i> Ekspor Berita Acara (BAP) .txt</h3>
                        <button onclick="exportBapTxt()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> Unduh Berita Acara (.txt)
                        </button>
                    </div>

                    <div class="glass-card p-6 rounded-2xl shadow-sm border border-red-200 bg-red-50/30 space-y-4">
                        <h3 class="font-bold text-base text-red-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Reset Perolehan Suara & Status Pemilih</h3>
                        <p class="text-xs text-slate-600">Mengembalikan perolehan suara semua kandidat menjadi 0 dan mengubah status seluruh pemilih DPT menjadi <strong>Belum</strong>.</p>
                        <button onclick="promptResetDatabase()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                            <i class="fa-solid fa-trash-can"></i> Reset Suara (Ketik HAPUS)
                        </button>
                    </div>
                </div>
            `;
        }

        window.saveDatetimeSetting = async function() {
            const val = document.getElementById('setting-datetime').value;
            if (!val) return;
            appState.settings.endTime = new Date(val).toISOString();
            await setDoc(doc(db, 'config', 'main'), { settings: appState.settings }, { merge: true });
            startCountdownTimer();
            showModal("Sukses", "Batas waktu pemilihan diperbarui di server.");
        }

        window.exportBapTxt = function() {
            const totalVoters = appState.dpt.length;
            const votedCount = appState.dpt.filter(d => d.status === 'Sudah').length;
            const sorted = [...appState.candidates].sort((a, b) => (b.suara || 0) - (a.suara || 0));

            let txt = `BERITA ACARA E-VOTING - ${appState.homeConfig.orgName}\nWaktu Cetak: ${new Date().toLocaleString('id-ID')}\n\n`;
            txt += `Total DPT: ${totalVoters} | Sudah Memilih: ${votedCount}\n\nPEROLEHAN SUARA:\n`;
            sorted.forEach((c, i) => { txt += `${i+1}. ${c.nama} - ${c.suara || 0} Suara\n`; });

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `BAP_EVoting_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        window.promptResetDatabase = function() {
            showModal("Konfirmasi Reset Suara", `
                <p class="text-red-600 font-bold mb-2">PERINGATAN!</p>
                <p class="text-xs text-slate-700 mb-4">Ketik kata <strong class="text-red-600">HAPUS</strong> untuk mereset seluruh perolehan suara:</p>
            `, async () => {
                const batch = writeBatch(db);
                appState.candidates.forEach(c => {
                    batch.update(doc(db, 'candidates', c.id), { suara: 0 });
                });
                appState.dpt.forEach(d => {
                    batch.update(doc(db, 'dpt', d.id), { status: 'Belum', votedAt: '-' });
                });
                await batch.commit();
                showModal("Reset Berhasil", "Seluruh perolehan suara dan status DPT telah dikembalikan ke 0.");
            }, true, "Reset Sekarang", {
                label: "Ketik HAPUS",
                placeholder: "HAPUS",
                validator: (val) => {
                    if (val !== "HAPUS") { showModal("Gagal", "Kata konfirmasi tidak sesuai!"); return false; }
                    return true;
                }
            });
        }

        // Jalankan inisialisasi Firebase saat halaman selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            initFirebaseListeners();
        });
    </script>
</body>
</html>
